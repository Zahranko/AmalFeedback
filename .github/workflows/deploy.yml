name: Deploy to Hostinger

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# The whole site is one self-contained static file, so this job is a checkout
# and an FTP sync — no toolchain, no build, and none of the app_offline.htm
# dance the .NET API's deploy needs (AlAmalBusiness/.github/workflows/deploy.yml),
# because static files are never locked by a running app pool.
#
# index.html sits at the repo root on purpose: Hostinger's built-in Git
# deployment clones the repo straight into the document root, so a page nested
# in a subfolder would serve nothing there. Keep it at the root and both
# deployment routes work.
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The action keeps a .ftp-deploy-sync-state.json on the server and diffs
      # against it, so a re-run uploads only what actually changed.
      - name: Deploy via FTP to Hostinger
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}

          # Hostinger accepts explicit TLS on port 21. If the handshake ever
          # fails, `ftp` is the fallback — but fix the certificate first rather
          # than sending the account password in the clear.
          protocol: ftps

          local-dir: ./

          # The subdomain's document root, as a repository *variable* (not a
          # secret) so it can be changed without editing this file. Hostinger's
          # File Manager shows the real path: usually /public_html/feedback/
          # for a subdomain of the main domain, or
          # /domains/feedback.<domain>/public_html/ when it was added as its
          # own domain. Must end with a slash.
          server-dir: ${{ vars.FTP_SERVER_DIR }}

          # Repo furniture that has no business on a public web root. The
          # action already skips .git* and node_modules by default; listing
          # them keeps the full set visible in one place.
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            README.md
